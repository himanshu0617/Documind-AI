version: "3.8"

services:
  # 1. FastAPI REST API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_TITLE=${APP_TITLE:-DocuMind AI}
      - DEBUG=${DEBUG:-False}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-25}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-3.8-flash}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-4}
      - API_TIMEOUT_SECONDS=${API_TIMEOUT_SECONDS:-30}
      - API_MAX_RETRIES=${API_MAX_RETRIES:-3}
      - MAX_UPLOAD_FILES=${MAX_UPLOAD_FILES:-5}
      - MAX_QUESTION_LENGTH=${MAX_QUESTION_LENGTH:-1000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    restart: unless-stopped

  # 2. Streamlit Interactive Dashboard
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_TITLE=${APP_TITLE:-DocuMind AI}
      - DEBUG=${DEBUG:-False}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-25}
      - MAX_UPLOAD_FILES=${MAX_UPLOAD_FILES:-5}
      - MAX_QUESTION_LENGTH=${MAX_QUESTION_LENGTH:-1000}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-3.8-flash}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-4}
      - API_TIMEOUT_SECONDS=${API_TIMEOUT_SECONDS:-30}
      - API_MAX_RETRIES=${API_MAX_RETRIES:-3}
    restart: unless-stopped
